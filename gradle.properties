org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# JBR de Android Studio: `java` no está en el PATH del sistema. Ajusta esta ruta
# si tu instalación de Android Studio vive en otro sitio.
org.gradle.java.home=C:\\Users\\Coti\\AppData\\Local\\Programs\\Android Studio\\jbr

kotlin.mpp.androidSourceSetLayoutVersion=2
# core/build.gradle.kts define a mano el source set intermedio jvmCommonMain
# (Android + JVM comparten la misma implementación de crypto/) — desactiva la
# plantilla de jerarquía por defecto para que no choque con esos dependsOn().
kotlin.mpp.applyDefaultHierarchyTemplate=false
